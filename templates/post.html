<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
{%- if unlisted %}
  <meta name="robots" content="noindex, nofollow">
{%- endif %}
  <link rel="icon" href="IMG_5210-circle.001.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v={{ version }}">
{%- if style %}
  <link rel="stylesheet" href="{{ style }}?v={{ style_version }}">
{%- endif %}
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
{%- if math %}
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
{%- endif %}
  </script>
{%- if math %}
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
{%- endif %}
</head>
<body>
<div class="frame">

  <header class="topbar">
    <a class="brand" href="index.html">Giulio Isacchini</a>
    <nav>
      <a href="index.html#writing">Writing</a>
      <button class="toggle" id="themeToggle" aria-label="Toggle color theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </header>

  <article class="article">
    <a class="back" href="index.html#writing">← Writing</a>
    <h1>{{ title }}</h1>
    <div class="byline">Giulio Isacchini · {{ tag }}</div>

    <div class="prose">
{{ content }}
    </div>
  </article>

  <footer class="foot">
    <span>© 2026 Giulio Isacchini</span>
    <span><a href="index.html">Home</a></span>
  </footer>

</div>

<script>
  document.getElementById('themeToggle').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });
</script>
{%- if script %}
<script src="{{ script }}" defer></script>
{%- endif %}
<script data-goatcounter="https://giulioisac.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
