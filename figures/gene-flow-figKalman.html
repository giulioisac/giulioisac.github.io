<figure class="fig" id="figKalman">
  <div class="fig-head">
    <span class="fig-tag">Fig. 1</span>
    <span class="fig-title">State-space model: hidden frequencies, noisy observations</span>
  </div>
  <div class="fig-body">
    <svg viewBox="0 0 704 176" role="img" aria-label="State-space model diagram with two rows. Top row: three open circles labeled X at times t minus 1, t, and t plus 1, each holding the vector of true frequencies across regions, connected left to right by rightward arrows that are labeled migration plus drift. Bottom row: three shaded circles labeled Y at the same times, each connected from the hidden state above by a downward arrow labeled sampling. Ellipses on both sides extend the chain in both directions. The formulas are given in the caption below.">
    <g transform="translate(0,-22)">

      <!-- every transition is the same step, labeled once on the right arrow
           to sit above the sampling label -->
      <text class="pcap" text-anchor="middle" x="448" y="54">MIGRATION + DRIFT</text>

      <!-- ··· indicators -->
      <text class="anno" text-anchor="middle" x="80" y="76">&#183;&#183;&#183;</text>
      <text class="anno" text-anchor="middle" x="624" y="76">&#183;&#183;&#183;</text>
      <text class="anno" text-anchor="middle" x="80" y="156">&#183;&#183;&#183;</text>
      <text class="anno" text-anchor="middle" x="624" y="156">&#183;&#183;&#183;</text>

      <!-- transition arrows: hidden → hidden (rightward, y=72) -->
      <line class="axis" x1="186" y1="72" x2="318" y2="72" stroke-width="1.5"/>
      <polygon class="mhead" points="326,72 318,68 318,76"/>
      <line class="axis" x1="378" y1="72" x2="510" y2="72" stroke-width="1.5"/>
      <polygon class="mhead" points="518,72 510,68 510,76"/>

      <!-- emission arrows: hidden → observed (downward) -->
      <line class="axis" x1="160" y1="98" x2="160" y2="119" stroke-width="1.5"/>
      <polygon class="mhead" points="160,126 156,119 164,119"/>
      <line class="axis" x1="352" y1="98" x2="352" y2="119" stroke-width="1.5"/>
      <polygon class="mhead" points="352,126 348,119 356,119"/>
      <line class="axis" x1="544" y1="98" x2="544" y2="119" stroke-width="1.5"/>
      <polygon class="mhead" points="544,126 540,119 548,119"/>

      <!-- sampling annotation between the rows, right side -->
      <text class="pcap" text-anchor="start" x="558" y="115">SAMPLING</text>

      <!-- hidden state circles (open) -->
      <circle cx="160" cy="72" r="26" style="fill:var(--panel);stroke:var(--ink);stroke-width:1.5"/>
      <circle cx="352" cy="72" r="26" style="fill:var(--panel);stroke:var(--ink);stroke-width:1.5"/>
      <circle cx="544" cy="72" r="26" style="fill:var(--panel);stroke:var(--ink);stroke-width:1.5"/>

      <!-- observation circles (shaded) -->
      <circle cx="160" cy="152" r="26" style="fill:var(--hair);stroke:var(--sub);stroke-width:1.5"/>
      <circle cx="352" cy="152" r="26" style="fill:var(--hair);stroke:var(--sub);stroke-width:1.5"/>
      <circle cx="544" cy="152" r="26" style="fill:var(--hair);stroke:var(--sub);stroke-width:1.5"/>

      <!-- hidden node labels with time index -->
      <text class="plabel" font-size="10" text-anchor="middle" x="160" y="76">X(t&#8722;1)</text>
      <text class="plabel" font-size="10" text-anchor="middle" x="352" y="76">X(t)</text>
      <text class="plabel" font-size="10" text-anchor="middle" x="544" y="76">X(t+1)</text>

      <!-- observation node labels with time index -->
      <text class="plabel" font-size="10" text-anchor="middle" x="160" y="156">Y(t&#8722;1)</text>
      <text class="plabel" font-size="10" text-anchor="middle" x="352" y="156">Y(t)</text>
      <text class="plabel" font-size="10" text-anchor="middle" x="544" y="156">Y(t+1)</text>
    </g>
    </svg>
  </div>
  <div class="fig-legend">
    <span class="key">
      <span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--panel);border:1.5px solid var(--ink);flex-shrink:0"></span>
      true frequencies X(t) in every region, unobserved
    </span>
    <span class="key">
      <span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--hair);border:1.5px solid var(--sub);flex-shrink:0"></span>
      sampled frequencies Y(t), observed
    </span>
  </div>
  <div class="fig-note">Standard graphical model notation: open nodes are hidden, shaded nodes are observed. The hidden state X(t) is the whole vector of true frequencies, one per region. Every transition is the same step of Eq. 1, migration by A plus drift &#951;, labeled once on the diagram; A is what couples the regions and it is what we are after. The drift &#951; has variance x(1&#8722;x)/N<sub>e</sub> per step, and observing the frequency in S sequences adds a further c&#160;x(1&#8722;x)/S, with c a per-region overdispersion. With Gaussian approximations in both terms the model becomes a Kalman filter, and its analytic likelihood makes parameter estimation cheap.</div>
</figure>
