<figure class="fig" id="figKalman">
  <div class="fig-head">
    <span class="fig-tag">Fig. 1</span>
    <span class="fig-title">State-space model: hidden frequencies, noisy observations</span>
  </div>
  <div class="fig-body">
    <svg viewBox="0 0 704 198" role="img" aria-label="State-space model diagram with two rows. Top row: three open circles labeled X at times t minus 1, t, and t plus 1, each holding the vector of true frequencies across regions, connected left to right by rightward arrows. Every transition arrow carries the same label, A times X plus eta: migration by the matrix A plus drift, with drift variance Q equals x times one minus x over Ne. Bottom row: three shaded circles labeled Y at the same times, each connected from the hidden state above by a downward arrow annotated sampling R equals c times x times one minus x over S. Ellipses on both sides extend the chain in both directions.">

      <!-- one caption for the transition row, and the same label on every
           transition arrow: each step is migration by A plus drift -->
      <text class="pcap" text-anchor="middle" x="352" y="26">MIGRATION + DRIFT</text>
      <text class="anno" text-anchor="middle" x="352" y="38">Q&#160;=&#160;x(1&#8722;x)&#160;/&#160;N<tspan dy="3" font-size="8">e</tspan></text>
      <text class="anno" text-anchor="middle" x="276" y="62">A&#8202;X&#160;+&#160;&#951;</text>
      <text class="anno" text-anchor="middle" x="424" y="62">A&#8202;X&#160;+&#160;&#951;</text>

      <!-- ··· indicators -->
      <text class="anno" text-anchor="middle" x="90" y="76">&#183;&#183;&#183;</text>
      <text class="anno" text-anchor="middle" x="614" y="76">&#183;&#183;&#183;</text>
      <text class="anno" text-anchor="middle" x="90" y="156">&#183;&#183;&#183;</text>
      <text class="anno" text-anchor="middle" x="614" y="156">&#183;&#183;&#183;</text>

      <!-- transition arrows: hidden → hidden (rightward, y=72) -->
      <line class="axis" x1="226" y1="72" x2="318" y2="72" stroke-width="1.5"/>
      <polygon class="mhead" points="326,72 318,68 318,76"/>
      <line class="axis" x1="378" y1="72" x2="470" y2="72" stroke-width="1.5"/>
      <polygon class="mhead" points="478,72 470,68 470,76"/>

      <!-- emission arrows: hidden → observed (downward) -->
      <line class="axis" x1="200" y1="98" x2="200" y2="119" stroke-width="1.5"/>
      <polygon class="mhead" points="200,126 196,119 204,119"/>
      <line class="axis" x1="352" y1="98" x2="352" y2="119" stroke-width="1.5"/>
      <polygon class="mhead" points="352,126 348,119 356,119"/>
      <line class="axis" x1="504" y1="98" x2="504" y2="119" stroke-width="1.5"/>
      <polygon class="mhead" points="504,126 500,119 508,119"/>

      <!-- sampling annotation between the rows, right side -->
      <text class="pcap" text-anchor="start" x="528" y="104">SAMPLING</text>
      <text class="anno" text-anchor="start" x="528" y="117">R&#160;=&#160;c&#160;x(1&#8722;x)&#160;/&#160;S</text>

      <!-- hidden state circles (open) -->
      <circle cx="200" cy="72" r="26" style="fill:var(--panel);stroke:var(--ink);stroke-width:1.5"/>
      <circle cx="352" cy="72" r="26" style="fill:var(--panel);stroke:var(--ink);stroke-width:1.5"/>
      <circle cx="504" cy="72" r="26" style="fill:var(--panel);stroke:var(--ink);stroke-width:1.5"/>

      <!-- observation circles (shaded) -->
      <circle cx="200" cy="152" r="26" style="fill:var(--hair);stroke:var(--sub);stroke-width:1.5"/>
      <circle cx="352" cy="152" r="26" style="fill:var(--hair);stroke:var(--sub);stroke-width:1.5"/>
      <circle cx="504" cy="152" r="26" style="fill:var(--hair);stroke:var(--sub);stroke-width:1.5"/>

      <!-- hidden node labels with time index -->
      <text class="plabel" font-size="10" text-anchor="middle" x="200" y="76">X(t&#8722;1)</text>
      <text class="plabel" font-size="10" text-anchor="middle" x="352" y="76">X(t)</text>
      <text class="plabel" font-size="10" text-anchor="middle" x="504" y="76">X(t+1)</text>

      <!-- observation node labels with time index -->
      <text class="plabel" font-size="10" text-anchor="middle" x="200" y="156">Y(t&#8722;1)</text>
      <text class="plabel" font-size="10" text-anchor="middle" x="352" y="156">Y(t)</text>
      <text class="plabel" font-size="10" text-anchor="middle" x="504" y="156">Y(t+1)</text>
    </svg>
  </div>
  <div class="fig-legend">
    <span class="key">
      <span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--panel);border:1.5px solid var(--ink);flex-shrink:0"></span>
      true frequencies X(t) in every region, unobserved
    </span>
    <span class="key">
      <span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--hair);border:1.5px solid var(--sub);flex-shrink:0"></span>
      sampled frequencies Y(t), observed
    </span>
  </div>
  <div class="fig-note">Standard graphical model notation: open nodes are hidden, shaded nodes are observed. The hidden state X(t) is the whole vector of true frequencies, one per region. Every transition is the one step of Eq. 1, migration by A plus drift &#951; of variance Q&#160;=&#160;x(1&#8722;x)/N<sub>e</sub>, which is why each arrow carries the same label; A is what couples the regions and it is what we are after. What we observe is the frequency counted in S sequences, adding sampling variance R&#160;=&#160;c&#160;x(1&#8722;x)/S with a per-region overdispersion c. With Gaussian approximations in both terms the model becomes a Kalman filter, and its analytic likelihood makes parameter estimation cheap.</div>
</figure>
